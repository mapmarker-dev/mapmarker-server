# 로컬 개발용 PostgreSQL. 접속 정보는 .env에서 읽는다.
# 개발 DB(POSTGRES_DB)와 e2e 테스트 DB(TEST_DATABASE_URL의 DB)가 이 컨테이너 하나에 함께 있다.
# 테스트 DB는 e2e를 돌릴 때 Prisma가 만든다.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env에 넣어 주세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣어 주세요}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 넣어 주세요}
    ports:
      # 이 컴퓨터에서만 접속할 수 있게 127.0.0.1에만 연다(같은 네트워크의 다른 기기는 못 붙는다).
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 이미지는 /var/lib/postgresql/<메이저 버전>/docker에 데이터를 둔다.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
